<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drett</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background-color: #36454F;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    .brand {
      font-size: clamp(48px, 12vw, 160px);
      letter-spacing: 0.6em;
      font-weight: 600;
      line-height: 1;
      margin: 0;
    }
    /* Wrap the 'e' so we can position the ellipsis above it */
    .e-wrap {
      position: relative;
      display: inline-block;
    }
    .e-wrap .ellipsis {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: -0.6em;          /* move above the character */
      font-size: 0.45em;    /* smaller than the main text */
      line-height: 1;
      pointer-events: none;
      color: inherit;
      letter-spacing: normal;
    }
  </style>
</head>
<body>
  <h1 class="brand">Dr<span class="e-wrap">e<span class="ellipsis">&hellip;</span></span>tt</h1>
</body>
</html>
